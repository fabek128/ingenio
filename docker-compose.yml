# INGENIO/64 — desarrollo local con Docker Compose
#
# Uso:
#   docker compose up -d --build     # levantar frontend + backend
#   docker compose down              # detener todo
#
# Frontend: http://localhost:8000
# Backend directo para debug: http://localhost:8080
#
# Nota: el modelo usa OpenCode Zen API (cloud), no requiere Ollama local.
# La API key se lee del archivo .env en la raiz del repo.

services:
  ingenio-api:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      INGENIO_ENV: ${INGENIO_ENV:-development}
      INGENIO_ALLOWED_ORIGIN: ${INGENIO_ALLOWED_ORIGIN:-http://localhost:8000}
      INGENIO_LLM_BASE_URL: ${INGENIO_LLM_BASE_URL:-https://opencode.ai/zen/v1}
      INGENIO_LLM_MODEL: ${INGENIO_LLM_MODEL:-deepseek-v4-flash-free}
      INGENIO_LLM_API_KEY: ${INGENIO_LLM_API_KEY}
      INGENIO_LLM_TIMEOUT_SECONDS: ${INGENIO_LLM_TIMEOUT_SECONDS:-45}
      INGENIO_LLM_MAX_TOKENS: ${INGENIO_LLM_MAX_TOKENS:-2048}
      INGENIO_SESSION_SECRET: ${INGENIO_SESSION_SECRET:-dev-only-insecure-change-in-prod}
      INGENIO_SESSION_TTL_SECONDS: ${INGENIO_SESSION_TTL_SECONDS:-3600}
      INGENIO_RATE_LIMIT_PER_MINUTE: ${INGENIO_RATE_LIMIT_PER_MINUTE:-12}
      INGENIO_MAX_MESSAGE_CHARS: ${INGENIO_MAX_MESSAGE_CHARS:-2000}
      INGENIO_CHAT_LOG_ENABLED: ${INGENIO_CHAT_LOG_ENABLED:-true}
      INGENIO_CHAT_LOG_INCLUDE_TEXT: ${INGENIO_CHAT_LOG_INCLUDE_TEXT:-true}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  ingenio-front:
    build: ./front
    environment:
      INGENIO_RESPONSE_TYPE_SPEED_MS: ${INGENIO_RESPONSE_TYPE_SPEED_MS:-6}
    depends_on:
      - ingenio-api
    ports:
      - "127.0.0.1:8000:80"
    restart: unless-stopped
